<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="100%" height="100%">
  <defs>
    <style>
      .page-bg { fill: #ffffff; }
      .header-bar { fill: #1e293b; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .header-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
      .q-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 10; }
      .q-num { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #1d4ed8; }
      .q-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #334155; }
      .q-math { font-family: 'Times New Roman', serif; font-size: 14px; font-style: italic; font-weight: 700; fill: #0f172a; }
      .opt-box { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .opt-letter { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #3730a3; }
      .watermark { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #cbd5e1; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="900" height="1350" class="page-bg" />
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" class="header-bar" />
  <text x="30" y="36" class="header-title">ЦООМО-1 • МАТЕМАТИКА (ЧАСТЬ I)</text>
  <text x="870" y="36" text-anchor="end" class="header-sub">СТРАНИЦА 2 • ВОПРОСЫ 7 – 15</text>

  <!-- Watermark / Footer -->
  <text x="450" y="1330" text-anchor="middle" class="watermark">ЦООМО / РЕСПУБЛИКАНСКОЕ ТЕСТИРОВАНИЕ • СТРАНИЦА 2 (7–15)</text>

  <!-- Questions 7 to 15 in compact test format -->
  <!-- Question 7 -->
  <g transform="translate(30, 75)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">7</text>
    <text x="50" y="29" class="q-text">Если 4 яблока стоят столько же, сколько 6 апельсинов, сколько апельсинов можно купить вместо 10 яблок?</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 12</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 15</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 16</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 18</text>
    </g>
  </g>

  <!-- Question 8 -->
  <g transform="translate(30, 210)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">8</text>
    <text x="50" y="29" class="q-text">Периметр прямоугольника равен 36 см, а его длина в 2 раза больше ширины. Найдите площадь прямоугольника:</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 72 см²</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 64 см²</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 81 см²</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 48 см²</text>
    </g>
  </g>

  <!-- Question 9 -->
  <g transform="translate(30, 345)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">9</text>
    <text x="50" y="29" class="q-text">Найдите сумму корней уравнения: x² - 7x + 10 = 0</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 10</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) -7</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 7</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) -10</text>
    </g>
  </g>

  <!-- Question 10 -->
  <g transform="translate(30, 480)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">10</text>
    <text x="50" y="29" class="q-text">Скорость поезда 72 км/ч. Какое расстояние в метрах он проходит за 25 секунд?</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 450 м</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 500 м</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 600 м</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 550 м</text>
    </g>
  </g>

  <!-- Question 11 -->
  <g transform="translate(30, 615)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">11</text>
    <text x="50" y="29" class="q-text">Найдите значение выражения: √144 - ∛27 + 2⁴</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 25</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 21</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 28</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 19</text>
    </g>
  </g>

  <!-- Question 12 -->
  <g transform="translate(30, 750)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">12</text>
    <text x="50" y="29" class="q-text">Товар стоил 1200 сомов. Сначала цену повысили на 20%, а затем снизили на 10%. Какова новая цена товара?</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 1296 сом</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 1320 сом</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 1240 сом</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 1300 сом</text>
    </g>
  </g>

  <!-- Question 13 -->
  <g transform="translate(30, 885)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">13</text>
    <text x="50" y="29" class="q-text">Какое наименьшее целое число удовлетворяет неравенству: 4x - 9 &gt; 11 ?</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 5</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 6</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 4</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 7</text>
    </g>
  </g>

  <!-- Question 14 -->
  <g transform="translate(30, 1020)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">14</text>
    <text x="50" y="29" class="q-text">Отношение чисел a : b = 3 : 5. Если a + b = 64, найдите разность (b - a):</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 16</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 24</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 8</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 12</text>
    </g>
  </g>

  <!-- Question 15 -->
  <g transform="translate(30, 1155)">
    <rect width="840" height="125" class="q-card" />
    <circle cx="24" cy="24" r="14" fill="#dbeafe" />
    <text x="24" y="29" text-anchor="middle" class="q-num">15</text>
    <text x="50" y="29" class="q-text">В классе 30 учеников. Из них 18 занимаются спортом, а 15 музыкой. Сколько учеников занимаются и тем, и другим, если каждый занимается хотя бы одним делом?</text>
    <g transform="translate(50, 65)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="opt-letter">А) 3</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="22" class="opt-letter">Б) 5</text>
      <rect x="400" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="412" y="22" class="opt-letter">В) 6</text>
      <rect x="600" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="612" y="22" class="opt-letter">Г) 8</text>
    </g>
  </g>
</svg>
