<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <style>
      .page-bg { fill: #ffffff; }
      .header-bar { fill: #1e293b; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .header-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
      .q-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .q-num { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #1d4ed8; }
      .q-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .q-math { font-family: 'Times New Roman', serif; font-size: 16px; font-style: italic; font-weight: 700; fill: #0f172a; }
      .opt-box { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .opt-badge { fill: #e0e7ff; stroke: #c7d2fe; rx: 4; }
      .opt-letter { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #3730a3; }
      .watermark { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #cbd5e1; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="900" height="1200" class="page-bg" />
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" class="header-bar" />
  <text x="30" y="36" class="header-title">ЦООМО-1 • МАТЕМАТИКА (ЧАСТЬ I)</text>
  <text x="870" y="36" text-anchor="end" class="header-sub">СТРАНИЦА 1 • ВОПРОСЫ 1 – 6</text>

  <!-- Watermark / Footer -->
  <text x="450" y="1180" text-anchor="middle" class="watermark">ЦООМО / РЕСПУБЛИКАНСКОЕ ТЕСТИРОВАНИЕ • ЧАСТЬ 1 (1–30)</text>

  <!-- Question 1 -->
  <g transform="translate(30, 80)">
    <rect width="840" height="160" class="q-card" />
    <circle cx="28" cy="28" r="16" fill="#dbeafe" />
    <text x="28" y="33" text-anchor="middle" class="q-num">1</text>
    <text x="56" y="33" class="q-text">Вычислите значение числового выражения:</text>
    <text x="56" y="70" class="q-math">2.4 × (1/2 + 3/4) - 0.6 = ?</text>
    
    <g transform="translate(56, 105)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="23" class="opt-letter">А)</text>
      <text x="40" y="23" class="opt-box">2.4</text>

      <rect x="180" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="195" y="23" class="opt-letter">Б)</text>
      <text x="220" y="23" class="opt-box">1.8</text>

      <rect x="360" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="375" y="23" class="opt-letter">В)</text>
      <text x="400" y="23" class="opt-box">2.1</text>

      <rect x="540" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="555" y="23" class="opt-letter">Г)</text>
      <text x="580" y="23" class="opt-box">3.0</text>
    </g>
  </g>

  <!-- Question 2 -->
  <g transform="translate(30, 260)">
    <rect width="840" height="160" class="q-card" />
    <circle cx="28" cy="28" r="16" fill="#dbeafe" />
    <text x="28" y="33" text-anchor="middle" class="q-num">2</text>
    <text x="56" y="33" class="q-text">Какое из следующих чисел делится на 3 и на 4 без остатка?</text>
    
    <g transform="translate(56, 75)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="23" class="opt-letter">А)</text>
      <text x="40" y="23" class="opt-box">3 416</text>

      <rect x="180" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="195" y="23" class="opt-letter">Б)</text>
      <text x="220" y="23" class="opt-box">4 524</text>

      <rect x="360" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="375" y="23" class="opt-letter">В)</text>
      <text x="400" y="23" class="opt-box">5 114</text>

      <rect x="540" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="555" y="23" class="opt-letter">Г)</text>
      <text x="580" y="23" class="opt-box">6 230</text>
    </g>
  </g>

  <!-- Question 3 -->
  <g transform="translate(30, 440)">
    <rect width="840" height="160" class="q-card" />
    <circle cx="28" cy="28" r="16" fill="#dbeafe" />
    <text x="28" y="33" text-anchor="middle" class="q-num">3</text>
    <text x="56" y="33" class="q-text">Если x = -3, то найдите значение выражения |2x - 5| + x²:</text>
    
    <g transform="translate(56, 75)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="23" class="opt-letter">А)</text>
      <text x="40" y="23" class="opt-box">20</text>

      <rect x="180" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="195" y="23" class="opt-letter">Б)</text>
      <text x="220" y="23" class="opt-box">18</text>

      <rect x="360" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="375" y="23" class="opt-letter">В)</text>
      <text x="400" y="23" class="opt-box">14</text>

      <rect x="540" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="555" y="23" class="opt-letter">Г)</text>
      <text x="580" y="23" class="opt-box">2</text>
    </g>
  </g>

  <!-- Question 4 -->
  <g transform="translate(30, 620)">
    <rect width="840" height="160" class="q-card" />
    <circle cx="28" cy="28" r="16" fill="#dbeafe" />
    <text x="28" y="33" text-anchor="middle" class="q-num">4</text>
    <text x="56" y="33" class="q-text">Упростите выражение при a &gt; 0:</text>
    <text x="56" y="70" class="q-math">(a³)² × a⁴ / a⁵ = ?</text>
    
    <g transform="translate(56, 105)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="23" class="opt-letter">А)</text>
      <text x="40" y="23" class="opt-box">a⁴</text>

      <rect x="180" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="195" y="23" class="opt-letter">Б)</text>
      <text x="220" y="23" class="opt-box">a⁵</text>

      <rect x="360" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="375" y="23" class="opt-letter">В)</text>
      <text x="400" y="23" class="opt-box">a⁶</text>

      <rect x="540" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="555" y="23" class="opt-letter">Г)</text>
      <text x="580" y="23" class="opt-box">a²</text>
    </g>
  </g>

  <!-- Question 5 -->
  <g transform="translate(30, 800)">
    <rect width="840" height="160" class="q-card" />
    <circle cx="28" cy="28" r="16" fill="#dbeafe" />
    <text x="28" y="33" text-anchor="middle" class="q-num">5</text>
    <text x="56" y="33" class="q-text">Решите уравнение: 3(2x - 4) = 4x + 6</text>
    
    <g transform="translate(56, 75)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="23" class="opt-letter">А)</text>
      <text x="40" y="23" class="opt-box">x = 6</text>

      <rect x="180" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="195" y="23" class="opt-letter">Б)</text>
      <text x="220" y="23" class="opt-box">x = 9</text>

      <rect x="360" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="375" y="23" class="opt-letter">В)</text>
      <text x="400" y="23" class="opt-box">x = 3</text>

      <rect x="540" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="555" y="23" class="opt-letter">Г)</text>
      <text x="580" y="23" class="opt-box">x = 12</text>
    </g>
  </g>

  <!-- Question 6 -->
  <g transform="translate(30, 980)">
    <rect width="840" height="160" class="q-card" />
    <circle cx="28" cy="28" r="16" fill="#dbeafe" />
    <text x="28" y="33" text-anchor="middle" class="q-num">6</text>
    <text x="56" y="33" class="q-text">Найдите 35% от числа 240:</text>
    
    <g transform="translate(56, 75)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="23" class="opt-letter">А)</text>
      <text x="40" y="23" class="opt-box">84</text>

      <rect x="180" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="195" y="23" class="opt-letter">Б)</text>
      <text x="220" y="23" class="opt-box">72</text>

      <rect x="360" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="375" y="23" class="opt-letter">В)</text>
      <text x="400" y="23" class="opt-box">96</text>

      <rect x="540" y="0" width="160" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="555" y="23" class="opt-letter">Г)</text>
      <text x="580" y="23" class="opt-box">80</text>
    </g>
  </g>
</svg>
